# scripts/upstream/libadwaita-1.conf — данные апстрима и Debian-ревизии для libadwaita.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball from GNOME 1.8 series. libadwaita 1.10.0 requires
# glib >= 2.89.3 and GTK4 >= 4.23.1, which are not available in Debian trixie
# (glib 2.84.4, GTK 4.18.6), so we build 1.8.8 which requires glib >= 2.80.0
# and GTK4 >= 4.19.4 — both satisfiable from trixie (and our own gtk4 on the
# closure path for GTK).
# Debian packaging taken from trixie (libadwaita-1_1.7.6-1~deb13u1); the 1.7.6
# control/rules/patches/symbols are the base. We adapt it to 1.8.8 by:
#   * raising libgtk-4-dev to >= 4.19.4 so our gtk4-4.22.5 is pulled in (not
#     the X11-enabled trixie 4.18.6);
#   * keeping debhelper-compat (= 13) and libglib2.0-dev (>= 2.80.0) as in
#     trixie 1.7.6 (unavailable in the 1.10.0 packaging);
#   * dropping libgnome-desktop-3-dev (pulls libgtk-3-dev and X11) and the
#     test-only deps (xauth, xvfb, mesa-vulkan-drivers, python3-gi);
#   * disabling documentation/example/test stanzas and the gi-docgen Build-Depends;
#   * commenting out the 2nd quilt patch (stylesheet-common-Use-opacity-...)
#     which fails to apply to 1.8.8;
#   * extending libadwaita-1-0.symbols with the 32 new symbols tagged
#     1.8~alpha / 1.8~beta (merged from the 1.10.0 symbols file).
VERSION="${VERSION:-1.8.8}"
TARBALL="libadwaita-1-${VERSION}.tar.xz"
URL="https://download.gnome.org/sources/libadwaita/1.8/libadwaita-${VERSION}.tar.xz"
ORIG_TAR="libadwaita-1_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1

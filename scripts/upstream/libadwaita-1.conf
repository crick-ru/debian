# scripts/upstream/libadwaita-1.conf — данные апстрима и Debian-ревизии для libadwaita.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Debian's own orig tarball, no repack suffix. Packaged from Debian
# (libadwaita-1_1.10.0-1) and reworked for this repository: X11 disabled,
# documentation/tests disabled, dbgsym disabled — see packages/libadwaita-1.
VERSION="${VERSION:-1.10.0}"
TARBALL="libadwaita-1-${VERSION}.tar.xz"
URL="https://deb.debian.org/debian/pool/main/liba/libadwaita-1/libadwaita-1_${VERSION}.orig.tar.xz"
ORIG_TAR="libadwaita-1_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1

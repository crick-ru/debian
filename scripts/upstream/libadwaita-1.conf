# scripts/upstream/libadwaita-1.conf — данные апстрима и Debian-ревизии для libadwaita.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball from GNOME. libadwaita 1.10.0 requires glib >= 2.89.3
# which is a development release not available in Debian trixie (2.84.4), so
# we use 1.8.8 which requires glib >= 2.80.0 and GTK4 >= 4.19.4.
# Debian packaging from libadwaita-1_1.10.0-2 (control, rules, patches) is reused
# with minimal adaptation; meson build system is stable across these versions.
VERSION="${VERSION:-1.8.8}"
TARBALL="libadwaita-1-${VERSION}.tar.xz"
URL="https://download.gnome.org/sources/libadwaita/1.8/libadwaita-${VERSION}.tar.xz"
ORIG_TAR="libadwaita-1_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1

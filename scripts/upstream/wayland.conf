# scripts/upstream/wayland.conf — данные апстрима и Debian-ревизии для пакета wayland.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball; identical to Debian's wayland_1.26.0.orig.tar.xz.
VERSION="${VERSION:-1.26.0}"
TARBALL="wayland-${VERSION}.tar.xz"
URL="https://gitlab.freedesktop.org/wayland/wayland/-/releases/${VERSION}/downloads/wayland-${VERSION}.tar.xz"
ORIG_TAR="wayland_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2

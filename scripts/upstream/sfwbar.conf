# scripts/upstream/sfwbar.conf — данные апстрима и Debian-ревизии для пакета sfwbar.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Upstream tags look like v1.0_beta17 (underscore), the Debian version is
# written as 1.0~beta17 (tilde), so the tilde is turned back into "_".
# The tilde has to be escaped as "\~": bash expands a bare "~" in the
# pattern of ${VAR/pat/rep} into the home directory, and the substitution
# silently does nothing.
VERSION="${VERSION:-1.0~beta17}"
TAG_VER="${VERSION/\~/_}"
TARBALL="sfwbar-${VERSION}.tar.gz"
URL="https://github.com/LBCrion/sfwbar/archive/refs/tags/v${TAG_VER}.tar.gz"
ORIG_TAR="sfwbar_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
# sfwbar: 3 убирает три quilt-патча — к 1.0~beta17 апстрим исправил опечатки и перевёл встроенные скрипты на сам python3, патчи стали no-op, и dpkg-source -b отказался собирать исходный пакет.
REVISION=3

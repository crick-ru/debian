# scripts/upstream/wayvnc.conf — данные апстрима и Debian-ревизии для пакета wayvnc.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Upstream tarball from GitHub (v0.10.2 tag). No Debian tarball exists
# on deb.debian.org/pool/main/w/wayvnc/ for 0.10.2 (Debian tracks 0.10.1).
VERSION="${VERSION:-0.10.2}"
TARBALL="wayvnc-${VERSION}.tar.gz"
URL="https://github.com/any1/wayvnc/archive/refs/tags/v${VERSION}.tar.gz"
ORIG_TAR="wayvnc_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1

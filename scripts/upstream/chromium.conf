# scripts/upstream/chromium.conf — данные апстрима и Debian-ревизии для пакета chromium.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# ВНИМАНИЕ: у chromium ДВА orig-тарбола. Кроме обычного
# chromium_<version>.orig.tar.xz есть ещё chromium_<version>.orig-pre-gen.tar.xz
# (16 МБ) — это файлы, которые Chromium генерирует во время сборки (bindgen,
# nodejs и т. п.). Debian генерирует их заранее на своей машине, потому что в
# stable бывают слишком старые bindgen/nodejs. dpkg-source при сборке исходников
# требует оба, поэтому здесь два URL.
#
# Упаковка взята из Debian unstable (chromium_154.0.8037.92-1) — ветка с
# последним обновлением безопасности; tarball у неё ровно тот, что использует
# Debian (файл пересобирается из официальных исходников скриптом
# debian/rules get-orig-source, версия та же, перепаковки +ds нет).
VERSION="${VERSION:-154.0.8037.92}"
TARBALL="chromium-${VERSION}.tar.xz"
URL="http://deb.debian.org/debian/pool/main/c/chromium/chromium_${VERSION}.orig.tar.xz"
ORIG_TAR="chromium_${VERSION}.orig.tar.xz"

# Второй тарбол (pre-gen): файлы, которые Chromium генерирует во время сборки
# (bindgen, nodejs и т. п.). Debian готовит их заранее, потому что в stable
# бывают слишком старые bindgen/nodejs; dpkg-source требует файл наравне с
# основным. Список дополнительных тарболов задаётся в .conf через
# EXTRA_TARBALLS + EXTRA_TARBALL_URLS, их качает fetch-upstream.sh.
PRE_GEN_TARBALL="chromium_${VERSION}.orig-pre-gen.tar.xz"
PRE_GEN_URL="http://deb.debian.org/debian/pool/main/c/chromium/${PRE_GEN_TARBALL}"
EXTRA_TARBALLS="${PRE_GEN_TARBALL}"
EXTRA_TARBALL_URLS="${PRE_GEN_URL}"

# Debian-ревизия нашей сборки: 1. В отличие от остальных пакетов репозитория
# здесь ревизию не пришлось поднимать выше Debian: в unstable лежит
# 154.0.8037.92-1, а наша версия 154.0.8037.92-1+crick новее неё за счёт
# суффикса (~deb отсутствует, +crick сравнивается с пустым концом строки как
# большая).
REVISION=1
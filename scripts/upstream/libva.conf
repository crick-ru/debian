# scripts/upstream/libva.conf — данные апстрима и Debian-ревизии для пакета libva.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Упаковка взята из Debian unstable (libva_2.24.1-2), tarball совпадает: URL
# ведёт в пул Debian, тот же файл использует и упаковка Debian. Взят именно
# unstable, а не trixie (там 2.22.0-3) — по правилу «Источник упаковки»
# порядок выбора: unstable — обычный случай. Переработана под
# требования репозитория: X11-путь и GLX VA-API не публикуются
# (-Dwith_x11=no убирает и GLX), X11-пакеты убраны из Build-Depends.
# Из шести бинарных пакетов Debian остаются четыре: libva2, libva-drm2,
# libva-wayland2, libva-dev. Разбор — в packages/libva/README.md.
#
# Зачем он нам: штатный libva-dev тянет libva-glx2, а тот Depends: libgl1,
# который пинит libglvnd0 версии trixie. Рядом с нашим libglvnd0 это
# неразрешимо, а libva-dev нужен mesa по Build-Depends ради VA-API.
# Пин снят: наш libva собран без GLX и X11, а drm- и wayland-пути на месте.
VERSION="${VERSION:-2.24.1}"
TARBALL="libva-${VERSION}.tar.gz"
URL="http://deb.debian.org/debian/pool/main/libv/libva/libva_${VERSION}.orig.tar.gz"
ORIG_TAR="libva_${VERSION}.orig.tar.gz"

# Debian-ревизия: 1 — переработанная упаковка Debian (первая наша сборка);
# 2 — возвращено Provides: libva-driver-abi-* в libva2 (без него установленный
# VA-драйвер отваливался после apt upgrade нашу сборку).
REVISION=2

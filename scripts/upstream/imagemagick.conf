# scripts/upstream/imagemagick.conf — данные апстрима и Debian-ревизии для пакета imagemagick.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball from GitHub. Debian repacks it as +dfsg1, which
# only exists for the versions Debian has uploaded; for the newest 7.1.2.x
# the plain upstream tarball is used. Note the epoch 8 (see below).
#
# "7.1.2-32" is ImageMagick's own upstream version (upstream numbers its
# releases with a dash), so it stays in VERSION as is: our Debian revision
# is REVISION below, and the binary version is 8:7.1.2-32-4+crick. The
# orig tarball name must therefore keep the whole version - stripping the
# "-32" made dpkg-source look for imagemagick_7.1.2.orig.tar.xz while the
# changelog announces upstream 7.1.2-32, and the source build failed.
VERSION="${VERSION:-7.1.2-32}"
TARBALL="ImageMagick-${VERSION}.tar.xz"
URL="https://github.com/ImageMagick/ImageMagick/releases/download/${VERSION}/ImageMagick-${VERSION}.tar.xz"
ORIG_TAR="imagemagick_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
# imagemagick: 1 опубликован с включённым делегатом HEIF, 2 — HEIF выключен, 3 —
# HEIF снова включён против libheif1 этого репозитория, 4 — WMF и OpenEXR
# выключены (--without-wmf --without-openexr): libwmf-dev и libopenexr-dev
# убраны из Depends libmagickcore-7.q16-dev.
REVISION=4

# Debian-epoch (пуст у большинства пакетов).
# imagemagick несёт epoch 8 по той же причине: в trixie лежит 8:7.1.1.43+dfsg1, поэтому наша 7.1.2-32-1+crick без epoch отсортировалась бы как более старая и обновление игнорировалось бы.
EPOCH="8"

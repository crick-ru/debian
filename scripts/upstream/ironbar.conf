# scripts/upstream/ironbar.conf — данные апстрима и Debian-ревизии для пакета ironbar.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Not packaged in Debian at all, so the debian/ directory here is written from
# scratch. Upstream is Rust (cargo), a GTK4 Layer Shell bar for Wayland
# compositors. Crates are fetched from crates.io at build time; Cargo.lock is
# pinned in the tarball so the crate set is reproducible.
VERSION="${VERSION:-0.19.1}"
TARBALL="ironbar-${VERSION}.tar.gz"
URL="https://github.com/JakeStanger/ironbar/archive/refs/tags/${VERSION}.tar.gz"
ORIG_TAR="ironbar_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки.
REVISION=1

# scripts/upstream/pixman.conf — данные апстрима и Debian-ревизии для пакета pixman.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Tarball byte-for-byte identical to Debian's pixman_0.46.4.orig.tar.gz.
VERSION="${VERSION:-0.46.4}"
TARBALL="pixman-${VERSION}.tar.gz"
URL="https://cairographics.org/releases/pixman-${VERSION}.tar.gz"
ORIG_TAR="pixman_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2

# scripts/upstream/at-spi2-core.conf — данные апстрима и Debian-ревизии для
# пакета at-spi2-core. Подключается (source) из scripts/fetch-upstream.sh.
#
# ВНИМАНИЕ: этот пакет — исключение из правила репозитория «собираем
# максимально свежие версии». Причина: браузер Яндекса (официальный deb,
# исходников нет) требует at-spi2-core, а мы не можем позволить ему тянуть
# libX11/libXi через libatspi. В trixie версия 2.56.2; апстрим новее, но
# новых версий не берём намеренно: пересборка потребовала бы пересмотра
# quilt-патчей, а выигрыша тут нет - задача пакета не изменилась.
#
# Упаковка взята из Debian: tarball побайтово совпадает с Debian-овским
# at-spi2-core_2.56.2.orig.tar.xz (никакого +dfsg/+ds нет).
VERSION="${VERSION:-2.56.2}"
TARBALL="at-spi2-core-${VERSION}.tar.xz"
URL="http://deb.debian.org/debian/pool/main/a/at-spi2-core/at-spi2-core_${VERSION}.orig.tar.xz"
ORIG_TAR="at-spi2-core_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 — после
# переработки под правила репозитория (X11 выключен, тесты и документация
# отключены, udeb не собирается). Без этого apt upgrade новую сборку не
# подхватил бы: версия не изменилась.
REVISION=2
# scripts/upstream/libglvnd.conf — данные апстрима и Debian-ревизии для пакета libglvnd.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Debian's own orig tarball (sha256 073e729…), byte-for-byte identical to the
# tag archive at gitlab.freedesktop.org/glvnd/libglvnd and to the NVIDIA
# mirror we used to obtain it. Packaging is taken from Debian
# (libglvnd_1.7.0-3) and reworked to drop X11, GLX, GL, OpenGL and OpenGL ES
# entirely: this repository has neither X11 nor GL, so of the fourteen binary
# packages Debian ships only four are published. See packages/libglvnd/README.md.
#
# Why we build it at all: the stock libegl-dev pulls libgl1-mesa-dev, whose
# Depends pins libgbm1 to the trixie version. Our mesa is 26.1.6, so the two
# cannot be installed together, and libegl-dev became unresolvable for the
# five packages that need it. Our build has no such pin - it carries neither
# X11 nor the GL wrappers at all.
VERSION="${VERSION:-1.7.0}"
TARBALL="libglvnd-${VERSION}.tar.gz"
URL="http://deb.debian.org/debian/pool/main/libg/libglvnd/libglvnd_${VERSION}.orig.tar.gz"
ORIG_TAR="libglvnd_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
# libglvnd: 1 — переработка без X11/GLX/GL, упаковка Debian взята как основа.
REVISION=1

# scripts/upstream/libva-utils.conf — данные апстрима и Debian-ревизии для пакета libva-utils.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Упаковка взята из Debian unstable (libva-utils_2.23.0-1, ветка 2.23) и
# переработана. Взята именно unstable, а не trixie — по правилу «Источник
# упаковки» порядок выбора: unstable — обычный случай.
#
# Tarball взят из GitHub release 2.24.0 (git tag), а не из Debian-овского
# libva-utils_2.23.0.orig.tar.xz: релизный tarball Debian 2.23.0 содержит
# только autotools (make dist), а GitHub release 2.24.0 — meson.build и
# meson_options.txt, которые требует debian/rules (--buildsystem=meson).
# Исходный код идентичен: тот же проект intel/libva-utils, версия 2.24.0
# совместима с libva 2.24.1 (API стабилен, libva-dev требует только >= 1.6.0).
#
# Переработана: X11-путь отключён (-Dx11=false), libx11-dev убран из
# Build-Depends — в репозитории нет X11. DRM и Wayland пути сохранены:
# vainfo работает через libva-drm2 и libva-wayland2. Тесты и документация
# не собираются (общие правила репозитория).
#
# Зачем он нам: vainfo — это утилита для диагностики VA-API, которая
# выводит информацию о поддерживаемых профилях и драйверах видеоускорения.
# Без неё пользователю нет способа проверить, что VA-API работает. Собирается
# против нашего libva 2.24.1 (без X11 и GLX).
VERSION="${VERSION:-2.24.0}"
TARBALL="libva-utils-${VERSION}.tar.gz"
URL="https://github.com/intel/libva-utils/archive/refs/tags/${VERSION}.tar.gz"
ORIG_TAR="libva-utils_${VERSION}.orig.tar.gz"

# Debian-ревизия: 1 — переработанная упаковка Debian (первая наша сборка).
REVISION=1

# scripts/upstream/gstreamer1.0-plugins-bad.conf — данные апстрима и Debian-ревизии для пакета gstreamer1.0-plugins-bad.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-1.28.7}"
TARBALL="gst-plugins-bad-${VERSION}.tar.xz"
URL="https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-${VERSION}.tar.xz"
ORIG_TAR="gstreamer1.0-plugins-bad_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=3
#   2 — libopengl-dev убран из Build-Depends: в собранных библиотеках ни
#   одного NEEDED на libGL/libGLX/libOpenGL/libGLES, GL пакет не нужен;
#   3 — добавлен libpixman-1-dev. Без него cairo.pc не резолвится, потому что
#   он требует pixman-1 в Requires.private, а pkgconf в trixie резолвит
#   Requires.private. Из-за этого pangocairo не находился, и плагины
#   analyticsoverlay и ttmlsubs молча выключались — dh_install падал на
#   отсутствующих файлах.

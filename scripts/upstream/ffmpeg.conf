# scripts/upstream/ffmpeg.conf — данные апстрима и Debian-ревизии для пакета ffmpeg.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball; identical to Debian's ffmpeg_9.0.2.orig.tar.xz.
# The Debian revision is 2, the version 9.0.2 and the epoch 7 (see below).
VERSION="${VERSION:-9.0.2}"
TARBALL="ffmpeg-${VERSION}.tar.xz"
URL="https://ffmpeg.org/releases/ffmpeg-${VERSION}.tar.xz"
ORIG_TAR="ffmpeg_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
# ffmpeg: первый опубликованный пакет собирался против опций FFmpeg 8.x и был опубликован как 9.0.2 без переработки, поэтому уже несёт ревизию 2.
REVISION=3

# Debian-epoch (пуст у большинства пакетов).
# ffmpeg несёт epoch 7 по историческим причинам Debian: без него наша версия 9.0.2-2+crick была бы *старее* штатной trixie 7:7.1.5, потому что apt сравнивает epoch первым, и apt upgrade её не подхватил бы.
EPOCH="7"

# scripts/upstream/ffmpeg.conf — данные апстрима и Debian-ревизии для пакета ffmpeg.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball; identical to Debian's ffmpeg_9.0.2.orig.tar.xz.
# The Debian revision is 2, the version 9.0.2 and the epoch 7 (see below).
VERSION="${VERSION:-9.0.2}"
TARBALL="ffmpeg-${VERSION}.tar.xz"
URL="https://ffmpeg.org/releases/ffmpeg-${VERSION}.tar.xz"
ORIG_TAR="ffmpeg_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и далее — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
#   2 — первая сборка под crick (FFmpeg 8.x в сборочной среде), Debian revision 2;
#   3 — возвращён `libavformat-dev`/`libavcodec-dev` в `Depends` `libavfilter-dev`
#       (скрытая зависимость через libavfilter.pc; см. packages/ffmpeg/README.md →
#       «Ревизия 3»);
#   4 — выключены родные кодеки DNxHD и ProRes и аудио-плагины
#       gme/gsm/mysofa/speex/theora/vidstab/openal/sndio (--disable-dnxhd
#       --disable-prores --disable-libgme --disable-libgsm --disable-libmysofa
#       --disable-libspeex --disable-libtheora --disable-libvidstab
#       --disable-openal --disable-sndio); соответствующие `-dev`-пакеты убраны
#       из Build-Depends (см. «Ревизия 4» в README.md).
REVISION=4

# Debian-epoch (пуст у большинства пакетов).
# ffmpeg несёт epoch 7 по историческим причинам Debian: без него наша версия 9.0.2-4+crick была бы *старее* штатной trixie 7:7.1.5, потому что apt сравнивает epoch первым, и apt upgrade её не подхватил бы.
# Обоснование выбора ревизии 4 — в packages/ffmpeg/README.md → «Ревизия 4».
EPOCH="7"

# scripts/upstream/pipewire.conf — данные апстрима и Debian-ревизии для пакета pipewire.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-1.6.9}"
TARBALL="pipewire-${VERSION}.tar.gz"
URL="https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/${VERSION}/pipewire-${VERSION}.tar.gz"
ORIG_TAR="pipewire_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=3
#   2 — переработка упаковки (docs/test/sound);
#   3 — libmysofa выключена (-Dlibmysofa=disabled), libmysofa-dev убран
#   из Build-Depends: HRTF-пространство звучания не используется клиентами.

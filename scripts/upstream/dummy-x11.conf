# scripts/upstream/dummy-x11.conf — данные апстрима и Debian-ревизии для пакета
# dummy-x11. Подключается (source) из scripts/fetch-upstream.sh.
#
# Упаковка написана с нуля для этого репозитория, апстрима нет: пакет состоит
# из объединённой библиотеки-заглушки dummy-x11.so (генерируется из списков
# символов), логирующей заглушки libxcb.so.1 (без делегирования) и
# diagnosticного скрипта. Каталог
# packages/dummy-x11/upstream нужен лишь потому, что build-package.sh и
# dpkg-source awaits дерево исходников; собирается он в минимальный тарбол
# на месте (NATIVE=1), ничего не скачивая.
#
# Версионирование здесь не имеет смысла в обычном смысле: обновляются не
# исходники, а списки символов (они лежат в debian/stubs/). Поэтому любое
# изменение состава заглушек требует поднять REVISION - иначе apt не подхватит
# новую сборку, потому что версия не изменится.
VERSION="${VERSION:-1.0}"
TARBALL="dummy-x11-${VERSION}.tar.gz"
URL=""
ORIG_TAR="dummy-x11_${VERSION}.orig.tar.gz"
NATIVE=1

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
# Ревизия 2: настоящая libxcb из trixie вместо заглушки, единая dummy-x11.so
# с симлинками вместо семи отдельных .so, заглушки libXau/libXdmcp, опции
# отчёта --brief/--full поменяны местами.
# Ревизия 3: libxcb заменена на логирующую заглушку с делегированием
# настоящей libxcb через dlopen/dlsym; настоящая libxcb скрыта по пути
# /usr/share/dummy-x11/hidden/libxcb-real.so.1.
# Ревизия 4: xcb_connection_has_error переопределена для возврата
# XCB_CONN_SERVER_UNAVAILABLE (0x3) вместо XCB_CONN_WAITING_FOR_SETUP (0x5);
# лог открывается в режиме append вместо truncate. Это заставляет браузер
# переключиться с X11 на Wayland.
# Ревизия 5: все функции, которые браузер вызывает (xcb_connect,
# xcb_connect_to_display_with_auth_info, xcb_connection_has_error,
# xcb_generate_id, xcb_flush, xcb_disconnect), переопределены на возврат
# жёстких значений вместо делегирования реальной libxcb. Одной
# xcb_connection_has_error недостаточно: браузер 200+ раз проверяет статус
# соединения, но не переходит на Wayland.
# Ревизия 7: делегирование убрано полностью. Заглушка libxcb больше не
# dlopenит и не dlsymит реальную libxcb — ни одной функции не делегируется.
# Настояющая libxcb удалена из пакета (debian/stubs/real/, include-binaries).
# Все 676 функций либо возвращают hardcode-значение (6 функций из
# STUB_OVERRIDES), либо логгируются и возвращают NULL.
REVISION=7
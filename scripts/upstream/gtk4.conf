# scripts/upstream/gtk4.conf — данные апстрима и Debian-ревизии для пакета gtk4.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball from GNOME. Debian repacks it as +ds, but that
# repack only exists for the versions Debian has uploaded; for the newest
# 4.22.x the plain tarball is used and the version stays 4.22.5.
VERSION="${VERSION:-4.22.5}"
TARBALL="gtk-${VERSION}.tar.xz"
URL="https://download.gnome.org/sources/gtk/4.22/gtk-${VERSION}.tar.xz"
ORIG_TAR="gtk4_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2
#   2 — libegl1-mesa-dev убран из Build-Depends и Depends: наша mesa-common-dev
#   уже ставит оба его файла (eglmesaext.h, eglext_angle.h), а сама mesa
#   объявляет Breaks: libegl1-mesa-dev.

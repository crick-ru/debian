# scripts/upstream/kmscon.conf — данные апстрима и Debian-ревизии для пакета kmscon.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-10.0.3}"
TARBALL="kmscon-${VERSION}.tar.gz"
URL="https://github.com/kmscon/kmscon/archive/refs/tags/v${VERSION}.tar.gz"
ORIG_TAR="kmscon_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2

# scripts/upstream/gstreamer1.0-plugins-good.conf — данные апстрима и Debian-ревизии для пакета gstreamer1.0-plugins-good.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-1.28.7}"
TARBALL="gst-plugins-good-${VERSION}.tar.xz"
URL="https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-${VERSION}.tar.xz"
ORIG_TAR="gstreamer1.0-plugins-good_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2
#   2 — выключены AMR (NB/WB), Speex, WavPack и audiofx
#   (-Damrnb=disabled -Damrwbdec=disabled -Dspeex=disabled -Dwavpack=disabled
#   -Daudiofx=disabled): ни один пакет репозитория не использует эти плагины/
#   кодеки, аудио идёт через Opus/Vorbis/FLAC. Убраны libopencore-amrnb-dev,
#   libopencore-amrwb-dev, libspeex-dev и libwavpack-dev из Build-Depends, а
#   libgstamrnb.so, libgstamrwbdec.so, libgstaudiofx.so, libgstspeex.so и
#   libgstwavpack.so — из .install.

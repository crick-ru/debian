# scripts/upstream/gstreamer1.0-plugins-good.conf — данные апстрима и Debian-ревизии для пакета gstreamer1.0-plugins-good.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-1.28.8}"
TARBALL="gst-plugins-good-${VERSION}.tar.xz"
URL="https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-${VERSION}.tar.xz"
ORIG_TAR="gstreamer1.0-plugins-good_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 — после неё
# (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2
#   2 — выключены AMR (NB/WB), Speex, WavPack, Icecast/Shout и audiofx
#   (-Damrnb=disabled -Damrwbdec=disabled -Dspeex=disabled -Dwavpack=disabled
#   -Dshout2=disabled -Daudiofx=disabled): ни один пакет репозитория не
#   использует эти плагины/кодеки, аудио идёт через Opus/Vorbis/FLAC.
#   Убраны libopencore-amrnb-dev, libopencore-amrwb-dev, libspeex-dev,
#   libwavpack-dev и libshout-dev из Build-Depends, а libgstamrnb.so,
#   libgstamrwbdec.so, libgstaudiofx.so, libgstspeex.so, libgstwavpack.so
#   и libgstshout2.so — из .install.

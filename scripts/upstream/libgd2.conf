# scripts/upstream/libgd2.conf — данные апстрима и Debian-ревизии для пакета libgd2.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Debian's own orig tarball, byte-for-byte the one dpkg-source expects. Upstream
# tag archive renamed, no repack suffix, so the version stays 2.3.3 (no +dfsg).
# Packaging is taken from Debian libgd2_2.3.3-14 (unstable, uploaded 2026-07-31,
# with the CVE-2026-9672 fix). It is newer than trixie's 2.3.3-14~deb13u1 only in
# the sense that the security upload already carries the same fixes; unstable is
# used because it is the branch that matches the newest security fix.
#
# The directory is named libgd2, not libgd3: libgd3 is the *binary* package,
# while dpkg-source looks for ../libgd2_2.3.3.orig.tar.gz - the name of the
# binary package would break the orig-tarball lookup, the same trap as gtk+3.0.
VERSION="${VERSION:-2.3.3}"
TARBALL="libgd2-${VERSION}.tar.gz"
URL="http://deb.debian.org/debian/pool/main/libg/libgd2/libgd2_${VERSION}.orig.tar.gz"
ORIG_TAR="libgd2_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки. Правило репозитория говорит «1 для нетронутой
# упаковки, 2 и 3 — после переработки», но здесь ревизия обязана быть не меньше
# Debian-ревизии trixie плюс единица: в trixie лежит 2.3.3-14~deb13u1, и наша
# 2.3.3-1+crick отсортировалась бы как СТАРАЯ (1 < 14), то есть apt upgrade
# никогда бы её не подхватил. Отсюда 15.
REVISION=15
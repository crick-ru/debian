# scripts/upstream/gtk+3.0.conf — данные апстрима и Debian-ревизии для пакета gtk+3.0.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball; byte-for-byte identical to Debian's
# gtk+3.0_3.24.52.orig.tar.xz (sha256 80931fa4…).
VERSION="${VERSION:-3.24.52}"
TARBALL="gtk-${VERSION}.tar.xz"
URL="https://download.gnome.org/sources/gtk/3.24/gtk-${VERSION}.tar.xz"
ORIG_TAR="gtk+3.0_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1

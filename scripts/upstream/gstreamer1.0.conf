# scripts/upstream/gstreamer1.0.conf — данные апстрима и Debian-ревизии для пакета gstreamer1.0.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# GStreamer core. All five source packages of the stack are released under
# the same version number, which is what makes the -dev packages line up.
VERSION="${VERSION:-1.28.7}"
TARBALL="gstreamer-${VERSION}.tar.xz"
URL="https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-${VERSION}.tar.xz"
ORIG_TAR="gstreamer1.0_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1

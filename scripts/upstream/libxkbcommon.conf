# scripts/upstream/libxkbcommon.conf — данные апстрима и Debian-ревизии для пакета libxkbcommon.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-1.13.1}"
TARBALL="libxkbcommon-${VERSION}.tar.gz"
URL="https://github.com/xkbcommon/libxkbcommon/archive/refs/tags/xkbcommon-${VERSION}.tar.gz"
ORIG_TAR="libxkbcommon_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2

# scripts/upstream/mpv.conf — данные апстрима и Debian-ревизии для пакета mpv.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-0.41.0}"
TARBALL="mpv-${VERSION}.tar.gz"
URL="https://github.com/mpv-player/mpv/archive/refs/tags/v${VERSION}.tar.gz"
ORIG_TAR="mpv_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
# mpv: 2 — переработка упаковки, 3 — отключение оптических дисков, DVB и VDPAU.
REVISION=3

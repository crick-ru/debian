# scripts/upstream/libdrm.conf — данные апстрима и Debian-ревизии для пакета libdrm.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Tarball byte-for-byte identical to Debian's libdrm_2.4.134.orig.tar.xz.
VERSION="${VERSION:-2.4.134}"
TARBALL="libdrm-${VERSION}.tar.xz"
URL="https://dri.freedesktop.org/libdrm/libdrm-${VERSION}.tar.xz"
ORIG_TAR="libdrm_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2

# scripts/upstream/dummyx11.conf — данные апстрима и Debian-ревизии для пакета
# dummyx11. Подключается (source) из scripts/fetch-upstream.sh.
#
# Упаковка написана с нуля для этого репозитория, апстрима нет: пакет состоит
# только из библиотек-заглушек X11 и apt-хука, которые генерируются из списков
# символов в packages/dummyx11/debian/stubs/. Каталог packages/dummyx11/upstream
# нужен лишь потому, что build-package.sh и dpkg-source ожидают дерево исходников;
# собирается он в минимальный тарбол на месте (NATIVE=1), ничего не скачивая.
#
# Версионирование здесь не имеет смысла в обычном смысле: обновляются не
# исходники, а списки символов (они лежат в debian/stubs/). Поэтому любое
# изменение состава заглушек требует поднять REVISION - иначе apt не подхватит
# новую сборку, потому что версия не изменится.
VERSION="${VERSION:-1.0}"
TARBALL="dummyx11-${VERSION}.tar.gz"
URL=""
ORIG_TAR="dummyx11_${VERSION}.orig.tar.gz"
NATIVE=1

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1
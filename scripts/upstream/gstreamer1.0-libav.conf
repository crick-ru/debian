# scripts/upstream/gstreamer1.0-libav.conf — данные апстрима и Debian-ревизии для пакета gstreamer1.0-libav.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-1.28.7}"
TARBALL="gst-libav-${VERSION}.tar.xz"
URL="https://gstreamer.freedesktop.org/src/gst-libav/gst-libav-${VERSION}.tar.xz"
ORIG_TAR="gstreamer1.0-libav_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1

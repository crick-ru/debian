# scripts/upstream/fdk-aac.conf — данные апстрима и Debian-ревизии для пакета fdk-aac.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-2.0.3}"
TARBALL="fdk-aac-${VERSION}.tar.gz"
URL="https://github.com/mstorsjo/fdk-aac/archive/refs/tags/v${VERSION}.tar.gz"
ORIG_TAR="fdk-aac_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2

# scripts/upstream/cairo.conf — данные апстрима и Debian-ревизии для пакета cairo.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball from cairographics.org. Debian repacks the very
# same archive (cairo_1.18.4.orig.tar.*), so the upstream version here is
# the same; the tarball is taken as published, without the repack.
#
# Packaging is NOT taken from Debian: debian/ is written from scratch for this
# repository. Debian has a cairo package, but the choice is allowed by the rule
# "if it is unsuitable" - Debian's packaging is tied to the X11 backends we do
# not build (cairo-xlib, cairo-xcb, cairo-xlib-xrender), and its binary split
# (libcairo2, libcairo2-dev, plus the gscript, xlib and udeb parts) does not
# match what this repository publishes. Written from scratch: changelog is the
# upstream-style one, there is no gbp.conf, no quilt patches, and control
# carries only the seven packages we actually ship.
# Verification that it is not Debian's packaging: no debian/patches/series,
# no debian/gbp.conf, no debian/watch, and control differs from Debian's both in
# the package list and in the X11 flags in rules (-Dxlib=disabled, -Dxcb=disabled,
# -Dxlib-xcb=disabled). See also packages/cairo/README.md.
VERSION="${VERSION:-1.18.6}"
TARBALL="cairo-${VERSION}.tar.xz"
URL="https://cairographics.org/releases/cairo-${VERSION}.tar.xz"
ORIG_TAR="cairo_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2

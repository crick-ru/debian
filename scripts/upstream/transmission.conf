# scripts/upstream/transmission.conf — данные апстрима и Debian-ревизии для пакета transmission.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
#
# Official release tarball from GitHub releases. Clean upstream version 4.1.3
# (Debian repacks as +dfsg, removing bundled third-party libs and prebuilt web
# assets, but our use-system-libs.patch makes CMake use system libraries and
# the webui target rebuilds assets via esbuild, so the plain tarball is used).
VERSION="${VERSION:-4.1.3}"
TARBALL="transmission-${VERSION}.tar.xz"
URL="https://github.com/transmission/transmission/releases/download/${VERSION}/transmission-${VERSION}.tar.xz"
ORIG_TAR="transmission_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1

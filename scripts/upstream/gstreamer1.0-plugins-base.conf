# scripts/upstream/gstreamer1.0-plugins-base.conf — данные апстрима и Debian-ревизии для пакета gstreamer1.0-plugins-base.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-1.28.7}"
TARBALL="gst-plugins-base-${VERSION}.tar.xz"
URL="https://gstreamer.freedesktop.org/src/gst-plugins-base/gst-plugins-base-${VERSION}.tar.xz"
ORIG_TAR="gstreamer1.0-plugins-base_${VERSION}.orig.tar.xz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=1

# scripts/upstream/celluloid.conf — данные апстрима и Debian-ревизии для пакета celluloid.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-0.29}"
TARBALL="celluloid-${VERSION}.tar.gz"
URL="https://github.com/celluloid-player/celluloid/archive/refs/tags/v${VERSION}.tar.gz"
ORIG_TAR="celluloid_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2

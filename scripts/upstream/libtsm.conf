# scripts/upstream/libtsm.conf — данные апстрима и Debian-ревизии для пакета libtsm.
# Подключается (source) из scripts/fetch-upstream.sh — править следует здесь.
VERSION="${VERSION:-4.8.0}"
TARBALL="libtsm-${VERSION}.tar.gz"
URL="https://github.com/kmscon/libtsm/archive/refs/tags/v${VERSION}.tar.gz"
ORIG_TAR="libtsm_${VERSION}.orig.tar.gz"

# Debian-ревизия нашей сборки: 1 для нетронутой упаковки, 2 и 3 — после её
# переработки (иначе apt upgrade новую сборку не подхватит: версия не изменилась).
REVISION=2

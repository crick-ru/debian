name: Build Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Inside a container job GitHub Actions defaults to "sh -e {0}", where bashisms
# (shopt, arrays, [[ ... ]]) are unavailable. All scripts and inline steps of this
# pipeline are written for bash, so bash is requested explicitly.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: packages with no internal dependencies (build toolchain only).
  # ---------------------------------------------------------------------------
  stage1:
    name: Stage 1 · ${{ matrix.package }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - fdk-aac
          - libtsm
          # - wlroots  # ВРЕМЕННО ОТКЛЮЧЕНО: сборка wlroots завершается ошибкой.
          #               Вернуть в матрицу после разбора ошибки сборки.
          - mpv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          # Enable contrib/non-free/non-free-firmware components of the archive
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 1

  # ---------------------------------------------------------------------------
  # Stage 2: packages that need Stage-1 libraries as build dependencies
  # (kmscon -> libtsm, pipewire -> libfdk-aac-dev).
  # labwc ВРЕМЕННО ОТКЛЮЧЁН вместе с wlroots (от которого он зависит).
  # ---------------------------------------------------------------------------
  stage2:
    name: Stage 2 · ${{ matrix.package }}
    needs: stage1
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - kmscon
          # - labwc  # ВРЕМЕННО ОТКЛЮЧЕНО: зависит от wlroots, который отключён в Stage 1.
          - pipewire
          - celluloid
          - sfwbar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Install required stage 1 packages
        run: |
          shopt -s nullglob
          # apt-get treats arguments without a path separator as package names,
          # so the downloaded .deb files are passed as ./stage1-pool/<file>.deb
          case "${{ matrix.package }}" in
            kmscon)
              debs=(./stage1-pool/libtsm*.deb)
              ;;
            # labwc)
            #   debs=(./stage1-pool/libwlroots-0.20_*.deb ./stage1-pool/libwlroots-0.20-dev_*.deb)
            #   ;;
            pipewire)
              # libfdk-aac-dev depends on the exact version of libfdk-aac2t64,
              # so both packages of Stage 1 have to be installed together
              debs=(./stage1-pool/libfdk-aac2t64_*.deb ./stage1-pool/libfdk-aac-dev_*.deb)
              ;;
            *)
              debs=()
              ;;
          esac
          if (( ${#debs[@]} > 0 )); then
            echo "Installing: ${debs[*]}"
            apt-get install -y --no-install-recommends "${debs[@]}"
          else
            echo "No stage 1 packages required for ${{ matrix.package }}"
          fi

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 2

  # ---------------------------------------------------------------------------
  # Stage 3: merge the full pool, generate APT metadata, publish to Pages.
  # ---------------------------------------------------------------------------
  publish:
    name: Stage 3 · generate APT repository
    needs: stage2
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install APT repository tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev \
            gnupg \
            gzip \
            xz-utils \
            curl \
            ca-certificates \
            python3

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Stage packages into repo-pool
        run: |
          mkdir -p repo-pool
          cp -v downloaded-artifacts/*.deb repo-pool/
          echo "==> Staged packages:"
          ls -l repo-pool/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "$GPG_PRIVATE_KEY" ]]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print "Signing key fingerprint: " $10; exit}'
          else
            echo "Warning: No GPG_PRIVATE_KEY found; repository will be unsigned."
          fi

      - name: Generate APT repository metadata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/generate-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Delete old CI artifacts
        # A free account shares 0.5 GB between the artifacts of all its
        # repositories. The packages are already uploaded to Pages and the
        # rebuilt .deb files live in the Actions cache, so old artifacts of
        # previous runs are useless weight.
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/cleanup-artifacts.sh 12

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


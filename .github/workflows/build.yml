                    ./stage1-pool/libwayland-server0_*.deb
                    ./stage1-pool/libwayland-cursor0_*.deb
                    ./stage1-pool/libwayland-egl1_*.deb
                    ./stage1-pool/libwayland-egl-backend-dev_*.deb

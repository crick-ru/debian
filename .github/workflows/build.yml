name: Build Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Inside a container job GitHub Actions defaults to "sh -e {0}", where bashisms
# (shopt, arrays, [[ ... ]]) are unavailable. All scripts and inline steps of this
# pipeline are written for bash, so bash is requested explicitly.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The stages follow one rule: an application is built in the last stage and
  # is moved to an earlier one only if a package of this repository is one of
  # its build dependencies. Stage 3 (the last one) therefore holds every
  # application that needs nothing beyond trixie plus the libraries below.
  #
  # Stage 1: libraries that are published in their own right and/or are needed
  #   as a build dependency further down:
  #   - wayland, libdrm, libxkbcommon, pixman, wayland-protocols: wlroots
  #     0.20.2 and GTK 4.22.5 need API and protocol versions that trixie does
  #     not have (see packages/wlroots/README.md);
  #   - libtsm: kmscon requires libtsm-dev >= 4.6.0, trixie has 4.0.2;
  #   - fdk-aac: pipewire needs the AAC codec for Bluetooth and pins the exact
  #     version of libfdk-aac2t64, so it must be the one of this repository.
  # ---------------------------------------------------------------------------
  stage1:
    name: Stage 1 · ${{ matrix.package }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - wayland
          - libdrm
          - libxkbcommon
          - pixman
          - wayland-protocols
          - libtsm
          - fdk-aac
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          # Enable contrib/non-free/non-free-firmware components of the archive
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 1

  # ---------------------------------------------------------------------------
  # Stage 2: libraries that the applications of Stage 3 build against. They are
  # here and not in Stage 3 only because the applications need their -dev
  # packages, which pin the exact versions of the sibling packages.
  #   wlroots   -> wayland/libdrm/libxkbcommon/pixman/wayland-protocols
  #   gtk+3.0,
  #   gtk4      -> wayland (GTK 4.22.5 refuses the wayland 1.23.1 of trixie)
  #   mpv       -> an application, but it is a build dependency of celluloid
  #                (libmpv-dev), so it has to be built before the last stage
  # cairo is NOT in this stage: it only needs libpixman-1-dev >= 0.40.0, which
  # trixie's pixman 0.44.0 satisfies, so it is built in the last stage like any
  # other package that does not need a library of this repository.
  # ---------------------------------------------------------------------------
  stage2:
    name: Stage 2 · ${{ matrix.package }}
    needs: stage1
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - wlroots
          - gtk+3.0
          - gtk4
          - mpv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Install required stage 1 packages
        run: |
          shopt -s nullglob
          # apt-get treats arguments without a path separator as package names,
          # so the downloaded .deb files are passed as ./stage1-pool/<file>.deb
          # Only wlroots, gtk+3.0 and gtk4 need anything from Stage 1, so the
          # common set is built once and libxkbcommon is added per package.
          debs=()
          case "${{ matrix.package }}" in
            wlroots|gtk+3.0|gtk4)
              # The -dev packages pin the exact versions of their siblings and
              # the versions of trixie do not satisfy the requirements: wlroots
              # needs wayland >= 1.24, libdrm >= 2.4.129, libxkbcommon >= 1.8,
              # pixman >= 0.46 and wayland-protocols >= 1.47, and GTK 4.22.5
              # needs libwayland-dev >= 1.24, which trixie (1.23.1) does not
              # have. The GTK -dev packages additionally need the matching
              # symbol files for dpkg-shlibdeps.
              debs=(./stage1-pool/libwayland-bin_*.deb
                    ./stage1-pool/libwayland-client0_*.deb
                    ./stage1-pool/libwayland-server0_*.deb
                    ./stage1-pool/libwayland-cursor0_*.deb
                    ./stage1-pool/libwayland-egl1_*.deb
                    ./stage1-pool/libwayland-egl-backend-dev_*.deb
                    ./stage1-pool/libwayland-dev_*.deb
                    ./stage1-pool/libdrm-common_*.deb
                    ./stage1-pool/libdrm2_*.deb
                    ./stage1-pool/libdrm-amdgpu1_*.deb
                    ./stage1-pool/libdrm-freedreno1_*.deb
                    ./stage1-pool/libdrm-intel1_*.deb
                    ./stage1-pool/libdrm-nouveau2_*.deb
                    ./stage1-pool/libdrm-radeon1_*.deb
                    ./stage1-pool/libdrm-dev_*.deb
                    ./stage1-pool/libpixman-1-0_*.deb
                    ./stage1-pool/libpixman-1-dev_*.deb
                    ./stage1-pool/wayland-protocols_*.deb)
              ;;
          esac
          if [[ "${{ matrix.package }}" == "wlroots" ]]; then
            # libxkbcommon of this repository goes to wlroots only: it requires
            # >= 1.8 and trixie has 1.7.0.
            #
            # It must NOT be installed for gtk+3.0/gtk4. Their GStreamer media
            # backend needs libgstreamer-plugins-bad1.0-dev, and the trixie
            # libgstreamer-plugins-bad1.0-0 Depends on the trixie
            # libxkbcommon-x11-0, which hard-pins libxkbcommon0 (= 1.7.0-2).
            # Since this repository no longer publishes libxkbcommon-x11-0 at
            # all, that mix is unsatisfiable and install-build-deps.sh could not
            # install anything. GTK 3 and GTK 4 do not need any libxkbcommon API
            # newer than the trixie 1.7.0, so they build against it as is.
            debs+=(./stage1-pool/libxkbcommon0_*.deb
                   ./stage1-pool/libxkbcommon-dev_*.deb
                   ./stage1-pool/libxkbregistry0_*.deb
                   ./stage1-pool/libxkbregistry-dev_*.deb)
          fi
          if (( ${#debs[@]} > 0 )); then
            echo "Installing: ${debs[*]}"
            apt-get install -y --no-install-recommends "${debs[@]}"
          else
            echo "No stage 1 packages required for ${{ matrix.package }}"
          fi

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 2

  # ---------------------------------------------------------------------------
  # Stage 3: the last stage. Everything that does not need a -dev package of
  # this repository lives here, i.e. every application plus cairo (it builds
  # against the trixie pixman, which satisfies its >= 0.40.0 requirement).
  #   kmscon    -> libtsm-dev of this repository (trixie has 4.0.2, kmscon
  #                needs >= 4.6.0)
  #   pipewire  -> libfdk-aac-dev of this repository (pins libfdk-aac2t64
  #                exactly)
  #   mpv is in Stage 2 (celluloid needs its libmpv-dev), so it is not here.
  #   labwc     -> libwlroots-0.20-dev of this repository
  #   celluloid -> libgtk-4-dev of this repository
  #   sfwbar    -> libgtk-3-dev of this repository
  #   cairo     -> nothing but trixie
  #
  # The GTK sets are not shared: sfwbar builds against GTK 3 and celluloid
  # against GTK 4, and only GTK 4 pulls gstreamer-bad (see the note in the
  # install step). The per-package additions are: celluloid needs libmpv-dev
  # (mpv is in Stage 2), sfwbar needs libxkbregistry-dev (Stage 1).
  #
  # celluloid and sfwbar must be built against the GTK of this repository, not
  # against trixie: the published libgtk-3.so.0/libgtk-4.so.1 have no
  # gdk_x11_* symbols (see packages/gtk+3.0/README.md), and Debian hardening links
  # with -Wl,-z,now, so a binary built with X11 support would not even start
  # against the published libraries. celluloid builds unchanged because its X11
  # code sits behind #ifdef GDK_WINDOWING_X11, which is undefined in these
  # builds.
  # ---------------------------------------------------------------------------
  stage3:
    name: Stage 3 · ${{ matrix.package }}
    needs: stage2
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - kmscon
          - pipewire
          - labwc
          - celluloid
          - sfwbar
          - cairo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Download stage 2 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage2-*
          path: stage2-pool
          merge-multiple: true

      - name: Install required packages of earlier stages
        run: |
          shopt -s nullglob
          # The -dev packages of Stage 1 and Stage 2 pin the exact versions of
          # their siblings, so a package that needs one of them needs the whole
          # matching set. Only labwc, celluloid and sfwbar do; kmscon, pipewire
          # and cairo need nothing but trixie (plus, for kmscon and pipewire,
          # the two libraries listed below).
          #
          # NOTE on libxkbcommon: it is deliberately NOT installed for celluloid
          # and pipewire. Our libgtk-4-1 depends on the trixie
          # libgstreamer-plugins-bad1.0-0, and that one depends on the trixie
          # libxkbcommon-x11-0, which hard-pins libxkbcommon0 (= 1.7.0-2). Since
          # this repository no longer publishes libxkbcommon-x11-0 at all,
          # mixing our libxkbcommon0 with the trixie gstreamer-bad is
          # unsatisfiable. labwc and sfwbar do not pull gstreamer-bad, so they
          # get our libxkbcommon.
          case "${{ matrix.package }}" in
            labwc)
              debs=(./stage2-pool/libwlroots-0.20_*.deb
                    ./stage2-pool/libwlroots-0.20-dev_*.deb
                    ./stage1-pool/libwayland-*.deb
                    ./stage1-pool/libxkbcommon0_*.deb
                    ./stage1-pool/libxkbcommon-dev_*.deb
                    ./stage1-pool/libxkbregistry0_*.deb
                    ./stage1-pool/libxkbregistry-dev_*.deb
                    ./stage1-pool/libdrm-common_*.deb
                    ./stage1-pool/libdrm2_*.deb
                    ./stage1-pool/libdrm-amdgpu1_*.deb
                    ./stage1-pool/libdrm-freedreno1_*.deb
                    ./stage1-pool/libdrm-intel1_*.deb
                    ./stage1-pool/libdrm-nouveau2_*.deb
                    ./stage1-pool/libdrm-radeon1_*.deb
                    ./stage1-pool/libdrm-dev_*.deb
                    ./stage1-pool/libpixman-1-0_*.deb
                    ./stage1-pool/libpixman-1-dev_*.deb
                    ./stage1-pool/wayland-protocols_*.deb)
              ;;
            celluloid)
              # libgtk-4-dev of this repository (it pins the whole GTK 4 set)
              # plus the Stage-1 libraries and libmpv-dev.
              debs=(./stage2-pool/libgtk-4-1_*.deb
                    ./stage2-pool/libgtk-4-common_*.deb
                    ./stage2-pool/libgtk-4-bin_*.deb
                    ./stage2-pool/libgtk-4-dev_*.deb
                    ./stage2-pool/gir1.2-gtk-4.0_*.deb
                    ./stage2-pool/gtk-update-icon-cache_*.deb
                    ./stage2-pool/libmpv2_*.deb
                    ./stage2-pool/libmpv-dev_*.deb
                    ./stage1-pool/libwayland-*.deb
                    ./stage1-pool/libdrm-common_*.deb
                    ./stage1-pool/libdrm2_*.deb
                    ./stage1-pool/libdrm-amdgpu1_*.deb
                    ./stage1-pool/libdrm-freedreno1_*.deb
                    ./stage1-pool/libdrm-intel1_*.deb
                    ./stage1-pool/libdrm-nouveau2_*.deb
                    ./stage1-pool/libdrm-radeon1_*.deb
                    ./stage1-pool/libdrm-dev_*.deb
                    ./stage1-pool/libpixman-1-0_*.deb
                    ./stage1-pool/libpixman-1-dev_*.deb
                    ./stage1-pool/wayland-protocols_*.deb)
              # No libxkbcommon of this repository (see the note above).
              ;;
            sfwbar)
              # libgtk-3-dev of this repository (it pins the whole GTK 3 set)
              # plus the Stage-1 libraries and libxkbregistry-dev. GTK 3 does
              # not pull gstreamer-bad, so our libxkbcommon is safe here.
              debs=(./stage2-pool/libgtk-3-0t64_*.deb
                    ./stage2-pool/libgail-3-0t64_*.deb
                    ./stage2-pool/libgtk-3-common_*.deb
                    ./stage2-pool/libgtk-3-bin_*.deb
                    ./stage2-pool/libgtk-3-dev_*.deb
                    ./stage2-pool/libgail-3-dev_*.deb
                    ./stage2-pool/gir1.2-gtk-3.0_*.deb
                    ./stage1-pool/libwayland-*.deb
                    ./stage1-pool/libdrm-common_*.deb
                    ./stage1-pool/libdrm2_*.deb
                    ./stage1-pool/libdrm-amdgpu1_*.deb
                    ./stage1-pool/libdrm-freedreno1_*.deb
                    ./stage1-pool/libdrm-intel1_*.deb
                    ./stage1-pool/libdrm-nouveau2_*.deb
                    ./stage1-pool/libdrm-radeon1_*.deb
                    ./stage1-pool/libdrm-dev_*.deb
                    ./stage1-pool/libpixman-1-0_*.deb
                    ./stage1-pool/libpixman-1-dev_*.deb
                    ./stage1-pool/wayland-protocols_*.deb
                    ./stage1-pool/libxkbcommon0_*.deb
                    ./stage1-pool/libxkbcommon-dev_*.deb
                    ./stage1-pool/libxkbregistry0_*.deb
                    ./stage1-pool/libxkbregistry-dev_*.deb)
              ;;
            kmscon)
              # libtsm-dev >= 4.6.0 is required and trixie has 4.0.2. The -dev
              # package pins libtsm4, so both go in.
              debs=(./stage1-pool/libtsm4_*.deb
                    ./stage1-pool/libtsm-dev_*.deb)
              ;;
            pipewire)
              # libfdk-aac-dev pins libfdk-aac2t64 to its own version.
              debs=(./stage1-pool/libfdk-aac2t64_*.deb
                    ./stage1-pool/libfdk-aac-dev_*.deb)
              ;;
            *)
              # cairo: nothing but trixie.
              debs=()
              ;;
          esac
          if (( ${#debs[@]} > 0 )); then
            echo "Installing: ${debs[*]}"
            apt-get install -y --no-install-recommends "${debs[@]}"
          else
            echo "No packages of earlier stages required for ${{ matrix.package }}"
          fi

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 3

  # ---------------------------------------------------------------------------
  # Stage 4: merge the full pool, generate APT metadata, publish to Pages.
  # ---------------------------------------------------------------------------
  publish:
    name: Stage 4 · generate APT repository
    needs: stage3
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: read
      # deleting old artifacts needs actions: write
      actions: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install APT repository tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev \
            gnupg \
            gzip \
            xz-utils \
            curl \
            ca-certificates \
            python3

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Stage packages into repo-pool
        run: |
          mkdir -p repo-pool
          cp -v downloaded-artifacts/*.deb repo-pool/
          echo "==> Staged packages:"
          ls -l repo-pool/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "$GPG_PRIVATE_KEY" ]]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print "Signing key fingerprint: " $10; exit}'
          else
            echo "Warning: No GPG_PRIVATE_KEY found; repository will be unsigned."
          fi

      - name: Generate APT repository metadata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/generate-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Delete old CI artifacts
        # A free account shares 0.5 GB between the artifacts of all its
        # repositories. The packages are already uploaded to Pages and the
        # rebuilt .deb files live in the Actions cache, so old artifacts of
        # previous runs are useless weight. Housekeeping must never break the
        # publication, hence continue-on-error.
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/cleanup-artifacts.sh 1 24

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


  publish:
    name: Stage 7 · generate APT repository
    needs: [build_wayland, build_libdrm, build_libxkbcommon, build_pixman, build_wayland-protocols, build_libtsm, build_fdk-aac, build_cairo, build_ffmpeg, build_gstreamer1_0, build_pulseaudio, build_aml, build_libheif, build_gstreamer1_0-plugins-base, build_wlroots, build_mpv, build_mesa, build_gstreamer1_0-plugins-good, build_gstreamer1_0-plugins-bad, build_neatvnc, build_gtk_3_0, build_gtk4, build_gstreamer1_0-libav, build_kmscon, build_pipewire, build_labwc, build_celluloid, build_sfwbar, build_wireplumber, build_pwvucontrol, build_imagemagick, build_wayvnc]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: read
      # deleting old artifacts needs actions: write
      actions: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install APT repository tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev \
            gnupg \
            gzip \
            xz-utils \
            curl \
            ca-certificates \
            python3

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Stage packages into repo-pool
        run: |
          mkdir -p repo-pool
          cp -v downloaded-artifacts/*.deb repo-pool/
          echo "==> Staged packages:"
          ls -l repo-pool/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "$GPG_PRIVATE_KEY" ]]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print "Signing key fingerprint: " $10; exit}'
          else
            echo "Warning: No GPG_PRIVATE_KEY found; repository will be unsigned."
          fi

      - name: Generate APT repository metadata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/generate-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Delete old CI artifacts
        # A free account shares 0.5 GB between the artifacts of all its
        # repositories. The packages are already uploaded to Pages and the
        # rebuilt .deb files live in the Actions cache, so old artifacts of
        # previous runs are useless weight. Housekeeping must never break the
        # publication, hence continue-on-error.
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/cleanup-artifacts.sh 1 24

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5




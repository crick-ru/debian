        run: |
          # Ensure Debian trixie repositories are configured (deb822 or legacy)
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            # Handle deb822 format: Components: main [contrib non-free non-free-firmware]
            # Match with optional leading whitespace and ensure main is present
            sed -i -E 's/^(\s*)Components: main(\s*)$/\1Components: main contrib non-free non-free-firmware/' \
              /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
            # Also handle case where Components line has multiple values but missing some
            sed -i -E 's/^(\s*)Components: main( contrib)?( non-free)?( non-free-firmware)?(\s*)$/\1Components: main contrib non-free non-free-firmware/' \
              /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          elif [ -f /etc/apt/sources.list ]; then
            sed -i -E 's/^deb (http:\/\/[^ ]+) main$/deb \1 main contrib non-free non-free-firmware/' \

            wireplumber)
              # PipeWire of this repository (Stage 4). The -dev packages pin
              # their runtime siblings, so the whole set travels together.
              debs=(./stage4-pool/libpipewire-0.3-0t64_*.deb
                    ./stage4-pool/libpipewire-0.3-common_*.deb
                    ./stage4-pool/libpipewire-0.3-dev_*.deb

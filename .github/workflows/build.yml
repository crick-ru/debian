name: Build Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Inside a container job GitHub Actions defaults to "sh -e {0}", where bashisms
# (shopt, arrays, [[ ... ]]) are unavailable. All scripts and inline steps of this
# pipeline are written for bash, so bash is requested explicitly.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The stages follow one rule: a library is built in the earliest stage in
  # which it is needed as a -dev package by something, an application is built
  # in the last stage and is moved earlier only if a package of this repository
  # is one of its build dependencies.
  #
  # Stage 1: libraries that are published in their own right and/or are needed
  #   as a build dependency further down:
  #   - wayland, libdrm, libxkbcommon, pixman, wayland-protocols: wlroots
  #     0.20.2 and GTK 4.22.5 need API and protocol versions that trixie does
  #     not have (see packages/wlroots/README.md);
  #   - libtsm: kmscon requires libtsm-dev >= 4.6.0, trixie has 4.0.2;
  #   - fdk-aac: pipewire needs the AAC codec for Bluetooth and pins the exact
  #     version of libfdk-aac2t64, so it must be the one of this repository;
  #   - cairo: gtk+3.0, gtk4 and labwc all build-depend on libcairo2-dev. It
  #     builds against the trixie pixman (which satisfies its >= 0.40.0
  #     requirement); the SONAME is unchanged, so apt upgrade substitutes ours.
  #   - ffmpeg: mpv and gstreamer1.0-libav build against our libav*-dev.
  #   - gstreamer1.0 (core): needed as -dev by every other GStreamer package,
  #     by GTK and by pipewire.
  # ---------------------------------------------------------------------------
  stage1:
    name: Stage 1 · ${{ matrix.package }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - wayland
          - libdrm
          - libxkbcommon
          - pixman
          - wayland-protocols
          - libtsm
          - fdk-aac
          - cairo
          - ffmpeg
          - gstreamer1.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          # Enable contrib/non-free/non-free-firmware components of the archive
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 1

  # ---------------------------------------------------------------------------
  # Stage 2: libraries that the later stages build against. They are here and
  # not in the last stage only because the consumers need their -dev packages,
  # which pin the exact versions of the sibling packages.
  #   gstreamer1.0-plugins-base -> gstreamer1.0 (core); it is itself needed as
  #                    -dev by good, bad, libav, gtk4 and pipewire
  #   wlroots       -> wayland/libdrm/libxkbcommon/pixman/wayland-protocols
  #   mpv           -> an application, but it is a build dependency of
  #                    celluloid (libmpv-dev), so it has to be built before the
  #                    last stage; it also builds against our ffmpeg
  # ---------------------------------------------------------------------------
  stage2:
    name: Stage 2 · ${{ matrix.package }}
    needs: stage1
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - gstreamer1.0-plugins-base
          - wlroots
          - mpv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Install required stage 1 packages
        run: |
          shopt -s nullglob
          # apt-get treats arguments without a path separator as package names,
          # so the downloaded .deb files are passed as ./stage1-pool/<file>.deb
          # The sets are per package: every consumer needs a different subset.
          debs=()
          case "${{ matrix.package }}" in
            gstreamer1.0-plugins-base)
              # The GStreamer core of this repository (>= 1.28.3 is required by
              # plugins-base). Everything else plugins-base needs - wayland,
              # pango, orc, ogg, vorbis, opus, theora, EGL, GLES, gbm, gudev,
              # iso-codes - trixie provides at a sufficient version.
              debs=(./stage1-pool/libgstreamer1.0-0_*.deb
                    ./stage1-pool/libgstreamer1.0-dev_*.deb
                    ./stage1-pool/gir1.2-gstreamer-1.0_*.deb)
              ;;
            wlroots|gtk+3.0|gtk4|labwc)
              # The -dev packages pin the exact versions of their siblings and
              # the versions of trixie do not satisfy the requirements: wlroots
              # needs wayland >= 1.24, libdrm >= 2.4.129, libxkbcommon >= 1.8,
              # pixman >= 0.46 and wayland-protocols >= 1.47, and GTK 4.22.5
              # needs libwayland-dev >= 1.24, which trixie (1.23.1) does not
              # have. The GTK -dev packages additionally need the matching
              # symbol files for dpkg-shlibdeps.
              debs=(./stage1-pool/libwayland-bin_*.deb
                    ./stage1-pool/libwayland-client0_*.deb
                    ./stage1-pool/libwayland-server0_*.deb
                    ./stage1-pool/libwayland-cursor0_*.deb
                    ./stage1-pool/libwayland-egl1_*.deb
                    ./stage1-pool/libwayland-egl-backend-dev_*.deb
                    ./stage1-pool/libwayland-dev_*.deb
                    ./stage1-pool/libdrm-common_*.deb
                    ./stage1-pool/libdrm2_*.deb
                    ./stage1-pool/libdrm-amdgpu1_*.deb
                    ./stage1-pool/libdrm-freedreno1_*.deb
                    ./stage1-pool/libdrm-intel1_*.deb
                    ./stage1-pool/libdrm-nouveau2_*.deb
                    ./stage1-pool/libdrm-radeon1_*.deb
                    ./stage1-pool/libdrm-dev_*.deb
                    ./stage1-pool/libpixman-1-0_*.deb
                    ./stage1-pool/libpixman-1-dev_*.deb
                    ./stage1-pool/wayland-protocols_*.deb
                    ./stage1-pool/libxkbcommon0_*.deb
                    ./stage1-pool/libxkbcommon-dev_*.deb
                    ./stage1-pool/libxkbregistry0_*.deb
                    ./stage1-pool/libxkbregistry-dev_*.deb)
              # cairo travels as a closed set: the -dev package pins the other
              # three to its own version, and the stock ones pin libcairo2 of
              # trixie, so mixing the two is unsatisfiable.
              debs+=(./stage1-pool/libcairo2_*.deb
                     ./stage1-pool/libcairo-gobject2_*.deb
                     ./stage1-pool/libcairo-script-interpreter2_*.deb
                     ./stage1-pool/libcairo2-dev_*.deb)
              ;;
            mpv)
              # mpv links against our FFmpeg 9.0.2. The -dev packages pin
              # their runtime siblings, and libavcodec-dev (>= 7:7.0) is only
              # satisfied by the version that carries the epoch 7.
              debs=(./stage1-pool/libavcodec63_*.deb
                    ./stage1-pool/libavcodec-dev_*.deb
                    ./stage1-pool/libavdevice63_*.deb
                    ./stage1-pool/libavdevice-dev_*.deb
                    ./stage1-pool/libavfilter12_*.deb
                    ./stage1-pool/libavfilter-dev_*.deb
                    ./stage1-pool/libavformat63_*.deb
                    ./stage1-pool/libavformat-dev_*.deb
                    ./stage1-pool/libavutil61_*.deb
                    ./stage1-pool/libavutil-dev_*.deb
                    ./stage1-pool/libswresample7_*.deb
                    ./stage1-pool/libswresample-dev_*.deb
                    ./stage1-pool/libswscale10_*.deb
                    ./stage1-pool/libswscale-dev_*.deb)
              ;;
          esac
          if (( ${#debs[@]} > 0 )); then
            echo "Installing: ${debs[*]}"
            apt-get install -y --no-install-recommends "${debs[@]}"
          else
            echo "No stage 1 packages required for ${{ matrix.package }}"
          fi

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 2

  # ---------------------------------------------------------------------------
  # Stage 3: the two remaining GStreamer plugin sets. "good" is a build
  # dependency of "bad" only for the test suite (Debian marks it <!nocheck>,
  # and our builds never build the tests), so the two can go in parallel; "bad"
  # is a build dependency of gtk4, because GstPlay - the library behind
  # gstreamer-play-1.0.pc, which the GTK 4 media backend requires - lives in
  # the "bad" set, not in "base".
  #   gstreamer1.0-plugins-good -> core (Stage 1) + plugins-base (Stage 2)
  #   gstreamer1.0-plugins-bad  -> core (Stage 1) + plugins-base (Stage 2)
  # ---------------------------------------------------------------------------
  stage3:
    name: Stage 3 · ${{ matrix.package }}
    needs: stage2
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - gstreamer1.0-plugins-good
          - gstreamer1.0-plugins-bad
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Download stage 2 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage2-*
          path: stage2-pool
          merge-multiple: true

      - name: Install required packages of earlier stages
        run: |
          shopt -s nullglob
          # The GStreamer core (Stage 1) and the base plugin set (Stage 2).
          # Every -dev package pins its runtime siblings, so the whole set goes
          # in together. "good" is deliberately not installed: the Debian
          # Build-Depends of "bad" lists it only as <!nocheck>, i.e. for the
          # test suite, which we never build.
          debs=(./stage1-pool/libgstreamer1.0-0_*.deb
                ./stage1-pool/libgstreamer1.0-dev_*.deb
                ./stage1-pool/gir1.2-gstreamer-1.0_*.deb
                ./stage2-pool/libgstreamer-gl1.0-0_*.deb
                ./stage2-pool/libgstreamer-plugins-base1.0-0_*.deb
                ./stage2-pool/libgstreamer-plugins-base1.0-dev_*.deb
                ./stage2-pool/gir1.2-gst-plugins-base-1.0_*.deb
                ./stage2-pool/gstreamer1.0-plugins-base_*.deb
                ./stage2-pool/gstreamer1.0-gl_*.deb)
          echo "Installing: ${debs[*]}"
          apt-get install -y --no-install-recommends "${debs[@]}"

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 3

  # ---------------------------------------------------------------------------
  # Stage 4: GTK, the FFmpeg bridge and the applications that need nothing of
  # this repository beyond Stage 1-3.
  #   gtk+3.0   -> wayland, cairo (Stage 1)
  #   gtk4      -> wayland, cairo, gstreamer core (Stage 1), plugins-base
  #                (Stage 2) and plugins-bad (Stage 3)
  #   gstreamer1.0-libav -> ffmpeg, gstreamer core, plugins-base, plugins-good
  #   kmscon    -> libtsm-dev of this repository (trixie has 4.0.2, kmscon
  #                needs >= 4.6.0)
  #   pipewire  -> libfdk-aac-dev (pins libfdk-aac2t64 exactly) and the
  #                gstreamer core plus plugins-base
  #   labwc     -> libwlroots-0.20-dev (Stage 2), cairo, xkbcommon
  #
  # celluloid and sfwbar are in Stage 5: they need libgtk-4-dev and
  # libgtk-3-dev respectively, and those are built here. The GTK sets are not
  # shared - sfwbar builds against GTK 3, celluloid against GTK 4.
  #
  # celluloid and sfwbar must be built against the GTK of this repository, not
  # against trixie: the published libgtk-3.so.0/libgtk-4.so.1 have no
  # gdk_x11_* symbols (see packages/gtk+3.0/README.md), and Debian hardening links
  # with -Wl,-z,now, so a binary built with X11 support would not even start
  # against the published libraries. celluloid builds unchanged because its X11
  # code sits behind #ifdef GDK_WINDOWING_X11, which is undefined in these
  # builds.
  # ---------------------------------------------------------------------------
  stage4:
    name: Stage 4 · ${{ matrix.package }}
    needs: stage3
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - gtk+3.0
          - gtk4
          - gstreamer1.0-libav
          - kmscon
          - pipewire
          - labwc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Download stage 2 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage2-*
          path: stage2-pool
          merge-multiple: true


      - name: Download stage 3 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage3-*
          path: stage3-pool
          merge-multiple: true

      - name: Install required packages of earlier stages
        run: |
          shopt -s nullglob
          # Every -dev package of this repository pins its runtime siblings, so
          # a consumer needs the whole matching set, not just the -dev file.
          #
          # NOTE on libxkbcommon: it is installed everywhere it is needed. The
          # old exception is gone - our libgstreamer-plugins-bad1.0-0 is built
          # with -Dx11=disabled and therefore depends neither on
          # libxkbcommon-x11-0 nor on libxkbcommon0, so it can no longer drag in
          # and pin the outdated 1.7.0-2 of trixie.
          case "${{ matrix.package }}" in
            gtk+3.0|gtk4)
              debs=(./stage1-pool/libwayland-bin_*.deb
                    ./stage1-pool/libwayland-client0_*.deb
                    ./stage1-pool/libwayland-server0_*.deb
                    ./stage1-pool/libwayland-cursor0_*.deb
                    ./stage1-pool/libwayland-egl1_*.deb
                    ./stage1-pool/libwayland-egl-backend-dev_*.deb
                    ./stage1-pool/libwayland-dev_*.deb
                    ./stage1-pool/libdrm-common_*.deb
                    ./stage1-pool/libdrm2_*.deb
                    ./stage1-pool/libdrm-amdgpu1_*.deb
                    ./stage1-pool/libdrm-freedreno1_*.deb
                    ./stage1-pool/libdrm-intel1_*.deb
                    ./stage1-pool/libdrm-nouveau2_*.deb
                    ./stage1-pool/libdrm-radeon1_*.deb
                    ./stage1-pool/libdrm-dev_*.deb
                    ./stage1-pool/libpixman-1-0_*.deb
                    ./stage1-pool/libpixman-1-dev_*.deb
                    ./stage1-pool/wayland-protocols_*.deb
                    ./stage1-pool/libcairo2_*.deb
                    ./stage1-pool/libcairo-gobject2_*.deb
                    ./stage1-pool/libcairo-script-interpreter2_*.deb
                    ./stage1-pool/libcairo2-dev_*.deb
                    ./stage1-pool/libgstreamer1.0-0_*.deb
                    ./stage1-pool/libgstreamer1.0-dev_*.deb
                    ./stage1-pool/gir1.2-gstreamer-1.0_*.deb
                    ./stage2-pool/libgstreamer-gl1.0-0_*.deb
                    ./stage2-pool/libgstreamer-plugins-base1.0-0_*.deb
                    ./stage2-pool/libgstreamer-plugins-base1.0-dev_*.deb
                    ./stage2-pool/gir1.2-gst-plugins-base-1.0_*.deb
                    ./stage2-pool/gstreamer1.0-plugins-base_*.deb
                    ./stage2-pool/gstreamer1.0-gl_*.deb)
              if [[ "${{ matrix.package }}" == "gtk4" ]]; then
                # The GTK 4 media backend needs GstPlay, and that library lives
                # in the "bad" set (Stage 3), not in "base". The "good" plugin
                # set travels with it: gstreamer1.0-plugins-bad declares
                # "Depends: gstreamer1.0-plugins-good (>= 1.28.0)", and the
                # 1.26.2 of trixie does not satisfy that.
                debs+=(./stage3-pool/libgstreamer-plugins-bad1.0-0_*.deb
                       ./stage3-pool/libgstreamer-plugins-bad1.0-dev_*.deb
                       ./stage3-pool/gir1.2-gst-plugins-bad-1.0_*.deb
                       ./stage3-pool/gstreamer1.0-plugins-bad_*.deb
                       ./stage3-pool/gstreamer1.0-plugins-good_*.deb)
              fi
              ;;
            gstreamer1.0-libav)
              # The FFmpeg of this repository (Stage 1) plus the GStreamer core
              # and the base and good plugin sets.
              debs=(./stage1-pool/libavcodec63_*.deb
                    ./stage1-pool/libavcodec-dev_*.deb
                    ./stage1-pool/libavdevice63_*.deb
                    ./stage1-pool/libavdevice-dev_*.deb
                    ./stage1-pool/libavfilter12_*.deb
                    ./stage1-pool/libavfilter-dev_*.deb
                    ./stage1-pool/libavformat63_*.deb
                    ./stage1-pool/libavformat-dev_*.deb
                    ./stage1-pool/libavutil61_*.deb
                    ./stage1-pool/libavutil-dev_*.deb
                    ./stage1-pool/libswresample7_*.deb
                    ./stage1-pool/libswresample-dev_*.deb
                    ./stage1-pool/libswscale10_*.deb
                    ./stage1-pool/libswscale-dev_*.deb
                    ./stage1-pool/libgstreamer1.0-0_*.deb
                    ./stage1-pool/libgstreamer1.0-dev_*.deb
                    ./stage1-pool/gir1.2-gstreamer-1.0_*.deb
                    ./stage2-pool/libgstreamer-gl1.0-0_*.deb
                    ./stage2-pool/libgstreamer-plugins-base1.0-0_*.deb
                    ./stage2-pool/libgstreamer-plugins-base1.0-dev_*.deb
                    ./stage2-pool/gir1.2-gst-plugins-base-1.0_*.deb
                    ./stage2-pool/gstreamer1.0-plugins-base_*.deb
                    ./stage2-pool/gstreamer1.0-gl_*.deb
                    ./stage3-pool/gstreamer1.0-plugins-good_*.deb)
              ;;
            kmscon)
              # libtsm-dev >= 4.6.0 is required and trixie has 4.0.2. The -dev
              # package pins libtsm4, so both go in.
              debs=(./stage1-pool/libtsm4_*.deb
                    ./stage1-pool/libtsm-dev_*.deb)
              ;;
            pipewire)
              # libfdk-aac-dev pins libfdk-aac2t64 to its own version; the
              # GStreamer core and base are needed for the video sinks.
              # libgstreamer-gl1.0-0 belongs to the base set and is pinned
              # exactly by gstreamer1.0-gl, while
              # gir1.2-gst-plugins-base-1.0 requires it as >= 1.27.2 - neither
              # can be satisfied by the 1.26.2 of trixie, so it travels along.
              debs=(./stage1-pool/libfdk-aac2t64_*.deb
                    ./stage1-pool/libfdk-aac-dev_*.deb
                    ./stage1-pool/libgstreamer1.0-0_*.deb
                    ./stage1-pool/libgstreamer1.0-dev_*.deb
                    ./stage1-pool/gir1.2-gstreamer-1.0_*.deb
                    ./stage2-pool/libgstreamer-gl1.0-0_*.deb
                    ./stage2-pool/libgstreamer-plugins-base1.0-0_*.deb
                    ./stage2-pool/libgstreamer-plugins-base1.0-dev_*.deb
                    ./stage2-pool/gir1.2-gst-plugins-base-1.0_*.deb
                    ./stage2-pool/gstreamer1.0-plugins-base_*.deb
                    ./stage2-pool/gstreamer1.0-gl_*.deb)
              ;;
            labwc)
              debs=(./stage2-pool/libwlroots-0.20_*.deb
                    ./stage2-pool/libwlroots-0.20-dev_*.deb
                    ./stage1-pool/libwayland-bin_*.deb
                    ./stage1-pool/libwayland-client0_*.deb
                    ./stage1-pool/libwayland-server0_*.deb
                    ./stage1-pool/libwayland-cursor0_*.deb
                    ./stage1-pool/libwayland-egl1_*.deb
                    ./stage1-pool/libwayland-egl-backend-dev_*.deb
                    ./stage1-pool/libwayland-dev_*.deb
                    ./stage1-pool/libxkbcommon0_*.deb
                    ./stage1-pool/libxkbcommon-dev_*.deb
                    ./stage1-pool/libxkbregistry0_*.deb
                    ./stage1-pool/libxkbregistry-dev_*.deb
                    ./stage1-pool/libdrm-common_*.deb
                    ./stage1-pool/libdrm2_*.deb
                    ./stage1-pool/libdrm-amdgpu1_*.deb
                    ./stage1-pool/libdrm-freedreno1_*.deb
                    ./stage1-pool/libdrm-intel1_*.deb
                    ./stage1-pool/libdrm-nouveau2_*.deb
                    ./stage1-pool/libdrm-radeon1_*.deb
                    ./stage1-pool/libdrm-dev_*.deb
                    ./stage1-pool/libpixman-1-0_*.deb
                    ./stage1-pool/libpixman-1-dev_*.deb
                    ./stage1-pool/wayland-protocols_*.deb
                    ./stage1-pool/libcairo2_*.deb
                    ./stage1-pool/libcairo-gobject2_*.deb
                    ./stage1-pool/libcairo-script-interpreter2_*.deb
                    ./stage1-pool/libcairo2-dev_*.deb)
              ;;
          esac
          if (( ${#debs[@]} > 0 )); then
            echo "Installing: ${debs[*]}"
            apt-get install -y --no-install-recommends "${debs[@]}"
          else
            echo "No packages of earlier stages required for ${{ matrix.package }}"
          fi

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 4

  # ---------------------------------------------------------------------------
  # Stage 5: wireplumber and the two GUI applications.
  #   wireplumber -> libpipewire-0.3-dev + libspa-0.2-dev of this repository
  #                 (Stage 4). WirePlumber is the session manager of PipeWire,
  #                 and it is also a build dependency of pwvucontrol
  #                 (libwireplumber-0.5-dev), which therefore moves to Stage 6.
  #   celluloid   -> libgtk-4-dev (Stage 4) + libmpv-dev (Stage 2)
  #   sfwbar      -> libgtk-3-dev (Stage 4) + libxkbregistry-dev (Stage 1)
  #
  # celluloid and sfwbar must be built against the GTK of this repository, not
  # against trixie: the published libgtk-3.so.0/libgtk-4.so.1 have no
  # gdk_x11_* symbols (see packages/gtk+3.0/README.md), and Debian hardening
  # links with -Wl,-z,now, so a binary built with X11 support would not even
  # start against the published libraries. celluloid builds unchanged because
  # its X11 code sits behind #ifdef GDK_WINDOWING_X11, which is undefined in
  # these builds.
  # ---------------------------------------------------------------------------
  stage5:
    name: Stage 5 · ${{ matrix.package }}
    needs: stage4
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - celluloid
          - sfwbar
          - wireplumber
    steps:
      - name: Checkout repository

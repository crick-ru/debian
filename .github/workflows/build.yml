name: Build Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Inside a container job GitHub Actions defaults to "sh -e {0}", where bashisms
# (shopt, arrays, [[ ... ]]) are unavailable. All scripts and inline steps of this
# pipeline are written for bash, so bash is requested explicitly.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:

  # -------------------------------------------------------------------------
  # Уровень 1.
  #
  # Уровень считается по фактическим спискам .deb ниже: пакет стоит
  # здесь, если все пакеты, чьи .deb он ставит, собраны раньше.
  # Барьеров стадий нет - job ждёт только тех, от кого зависит.
  # -------------------------------------------------------------------------
  build_wayland:
    name: wayland (ур. 1)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3 \

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: wayland
          stage: 1

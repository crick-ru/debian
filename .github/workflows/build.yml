name: Build Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Inside a container job GitHub Actions defaults to "sh -e {0}", where bashisms
# (shopt, arrays, [[ ... ]]) are unavailable. All scripts and inline steps of this
# pipeline are written for bash, so bash is requested explicitly.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: packages with no internal dependencies (build toolchain only).
  # The five packages below (wayland, libdrm, libxkbcommon, pixman,
  # wayland-protocols) are here because wlroots 0.20.2 needs the API and the
  # protocols introduced after the versions shipped in trixie (see
  # packages/wlroots/README.md).
  # ---------------------------------------------------------------------------
  stage1:
    name: Stage 1 · ${{ matrix.package }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - fdk-aac
          - libtsm
          - libdrm
          - pixman
          - wayland
          - libxkbcommon
          - wayland-protocols
          - mpv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          # Enable contrib/non-free/non-free-firmware components of the archive
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 1

  # ---------------------------------------------------------------------------
  # Stage 2: packages that need Stage-1 packages as build dependencies
  # (kmscon -> libtsm, pipewire -> libfdk-aac-dev,
  #  wlroots/gtk+3.0/gtk4 -> wayland/libdrm/libxkbcommon/pixman/wayland-protocols
  #  of this repository).
  #
  # gtk+3.0 and gtk4 need libwayland-dev >= 1.24 (GTK 4.22.5 refuses to configure
  # against the wayland 1.23.1 of trixie), so they install the same set of
  # Stage-1 packages as wlroots.
  # ---------------------------------------------------------------------------
  stage2:
    name: Stage 2 · ${{ matrix.package }}
    needs: stage1
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - kmscon
          - wlroots
          - pipewire
          - celluloid
          - sfwbar
          - gtk+3.0
          - gtk4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Install required stage 1 packages
        run: |
          shopt -s nullglob
          # apt-get treats arguments without a path separator as package names,
          # so the downloaded .deb files are passed as ./stage1-pool/<file>.deb
          case "${{ matrix.package }}" in
            kmscon)
              debs=(./stage1-pool/libtsm*.deb)
              ;;
            wlroots|gtk+3.0|gtk4)
              # wlroots 0.20.2 needs the libraries of this repository: all of
              # them have to be passed here, because the -dev packages pin the
              # exact versions of their siblings and the versions of trixie do
              # not satisfy the requirements of wlroots. The same list is used
              # for gtk+3.0 and gtk4: GTK 4.22.5 requires libwayland-dev >= 1.24,
              # which trixie does not have, and the -dev packages of the GTK
              # packages must see the matching symbol files.
              debs=(./stage1-pool/libwayland-bin_*.deb
                    ./stage1-pool/libwayland-client0_*.deb
                    ./stage1-pool/libwayland-server0_*.deb
                    ./stage1-pool/libwayland-cursor0_*.deb
                    ./stage1-pool/libwayland-egl1_*.deb
                    ./stage1-pool/libwayland-egl-backend-dev_*.deb
                    ./stage1-pool/libwayland-dev_*.deb
                    ./stage1-pool/libxkbcommon0_*.deb
                    ./stage1-pool/libxkbcommon-dev_*.deb
                    ./stage1-pool/libxkbcommon-x11-0_*.deb
                    ./stage1-pool/libxkbcommon-x11-dev_*.deb
                    ./stage1-pool/libxkbregistry0_*.deb
                    ./stage1-pool/libxkbregistry-dev_*.deb
                    ./stage1-pool/libdrm-common_*.deb
                    ./stage1-pool/libdrm2_*.deb
                    ./stage1-pool/libdrm-amdgpu1_*.deb
                    ./stage1-pool/libdrm-freedreno1_*.deb
                    ./stage1-pool/libdrm-intel1_*.deb
                    ./stage1-pool/libdrm-nouveau2_*.deb
                    ./stage1-pool/libdrm-radeon1_*.deb
                    ./stage1-pool/libdrm-dev_*.deb
                    ./stage1-pool/libpixman-1-0_*.deb
                    ./stage1-pool/libpixman-1-dev_*.deb
                    ./stage1-pool/wayland-protocols_*.deb)
              ;;
            pipewire)
              # libfdk-aac-dev depends on the exact version of libfdk-aac2t64,
              # so both packages of Stage 1 have to be installed together
              debs=(./stage1-pool/libfdk-aac2t64_*.deb ./stage1-pool/libfdk-aac-dev_*.deb)
              ;;
            *)
              debs=()
              ;;
          esac
          if (( ${#debs[@]} > 0 )); then
            echo "Installing: ${debs[*]}"
            apt-get install -y --no-install-recommends "${debs[@]}"
          else
            echo "No stage 1 packages required for ${{ matrix.package }}"
          fi

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 2

  # ---------------------------------------------------------------------------
  # Stage 3: packages that need the wlroots libraries of Stage 2
  # (labwc -> libwlroots-0.20-dev).
  # The libraries of Stage 1 are installed as well: the -dev package of wlroots
  # requires their exact versions, and dpkg-shlibdeps has to see the matching
  # symbol files to resolve the dependencies of libwlroots.
  # ---------------------------------------------------------------------------
  stage3:
    name: Stage 3 · ${{ matrix.package }}
    needs: stage2
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - labwc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Download stage 2 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage2-*
          path: stage2-pool
          merge-multiple: true

      - name: Install required packages of earlier stages
        run: |
          shopt -s nullglob
          debs=(./stage2-pool/libwlroots-0.20_*.deb ./stage2-pool/libwlroots-0.20-dev_*.deb
                ./stage1-pool/libwayland-bin_*.deb
                ./stage1-pool/libwayland-client0_*.deb
                ./stage1-pool/libwayland-server0_*.deb
                ./stage1-pool/libwayland-cursor0_*.deb
                ./stage1-pool/libwayland-egl1_*.deb
                ./stage1-pool/libwayland-egl-backend-dev_*.deb
                ./stage1-pool/libwayland-dev_*.deb
                ./stage1-pool/libxkbcommon0_*.deb
                ./stage1-pool/libxkbcommon-dev_*.deb
                ./stage1-pool/libxkbregistry0_*.deb
                ./stage1-pool/libxkbregistry-dev_*.deb
                ./stage1-pool/libdrm-common_*.deb
                ./stage1-pool/libdrm2_*.deb
                ./stage1-pool/libdrm-amdgpu1_*.deb
                ./stage1-pool/libdrm-freedreno1_*.deb
                ./stage1-pool/libdrm-intel1_*.deb
                ./stage1-pool/libdrm-nouveau2_*.deb
                ./stage1-pool/libdrm-radeon1_*.deb
                ./stage1-pool/libdrm-dev_*.deb
                ./stage1-pool/libpixman-1-0_*.deb
                ./stage1-pool/libpixman-1-dev_*.deb
                ./stage1-pool/wayland-protocols_*.deb)
          echo "Installing: ${debs[*]}"
          apt-get install -y --no-install-recommends "${debs[@]}"

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 3

  # ---------------------------------------------------------------------------
  # Stage 4: merge the full pool, generate APT metadata, publish to Pages.
  # ---------------------------------------------------------------------------
  publish:
    name: Stage 4 · generate APT repository
    needs: stage3
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: read
      # deleting old artifacts needs actions: write
      actions: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install APT repository tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev \
            gnupg \
            gzip \
            xz-utils \
            curl \
            ca-certificates \
            python3

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Stage packages into repo-pool
        run: |
          mkdir -p repo-pool
          cp -v downloaded-artifacts/*.deb repo-pool/
          echo "==> Staged packages:"
          ls -l repo-pool/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "$GPG_PRIVATE_KEY" ]]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print "Signing key fingerprint: " $10; exit}'
          else
            echo "Warning: No GPG_PRIVATE_KEY found; repository will be unsigned."
          fi

      - name: Generate APT repository metadata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/generate-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Delete old CI artifacts
        # A free account shares 0.5 GB between the artifacts of all its
        # repositories. The packages are already uploaded to Pages and the
        # rebuilt .deb files live in the Actions cache, so old artifacts of
        # previous runs are useless weight. Housekeeping must never break the
        # publication, hence continue-on-error.
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/cleanup-artifacts.sh 1 24

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


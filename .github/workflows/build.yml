  # ---------------------------------------------------------------------------
  # Stage 6: the last two applications.
  #   pwvucontrol  -> libgtk-4-dev (Stage 4), libpipewire-0.3-dev (Stage 4) and
  #                   libwireplumber-0.5-dev (Stage 5). It has to come after
  #                   WirePlumber: 0.5.3 requires wireplumber >= 0.5.11 and
  #                   trixie only has 0.5.8.
  #                   IMPORTANT: it must be built against the GTK 4 of this
  #                   repository, exactly like celluloid - the published
  #                   libgtk-4.so.1 has no gdk_x11_* symbols.
  #   imagemagick  -> needs nothing of this repository. It is an application,
  #                   so by the staging rule it is built in the last stage.
  #
  # Note that pwvucontrol is a Rust program: its build downloads crates from
  # crates.io and one git dependency, pinned in the Cargo.lock of the tarball.
  # ---------------------------------------------------------------------------
  stage6:
    name: Stage 6 · ${{ matrix.package }}
    needs: stage5
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        package:
          - pwvucontrol
          - imagemagick
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Download stage 2 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage2-*
          path: stage2-pool
          merge-multiple: true

      - name: Download stage 3 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage3-*
          path: stage3-pool
          merge-multiple: true

      - name: Download stage 4 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage4-*
          path: stage4-pool
          merge-multiple: true

      - name: Download stage 5 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage5-*
          path: stage5-pool
          merge-multiple: true

      - name: Install required packages of earlier stages
        run: |
          shopt -s nullglob
          case "${{ matrix.package }}" in
            pwvucontrol)
              # GTK 4 of this repository (it pins the whole GTK 4 set) plus the
              # libraries it pulls in, PipeWire (Stage 4) and WirePlumber
              # (Stage 5). The -dev packages pin their runtime siblings, so
              # every set goes in as a whole.
              debs=(./stage4-pool/libgtk-4-1_*.deb
                    ./stage4-pool/libgtk-4-common_*.deb
                    ./stage4-pool/libgtk-4-bin_*.deb
                    ./stage4-pool/libgtk-4-dev_*.deb
                    ./stage4-pool/gir1.2-gtk-4.0_*.deb
                    ./stage4-pool/gtk-update-icon-cache_*.deb
                    ./stage4-pool/libpipewire-0.3-0t64_*.deb
                    ./stage4-pool/libpipewire-0.3-common_*.deb
                    ./stage4-pool/libpipewire-0.3-dev_*.deb
                    ./stage4-pool/libpipewire-0.3-modules_*.deb
                    ./stage4-pool/libspa-0.2-dev_*.deb
                    ./stage4-pool/libspa-0.2-modules_*.deb
                    ./stage5-pool/libwireplumber-0.5-0_*.deb
                    ./stage5-pool/libwireplumber-0.5-dev_*.deb
                    ./stage1-pool/libwayland-bin_*.deb
                    ./stage1-pool/libwayland-client0_*.deb
                    ./stage1-pool/libwayland-server0_*.deb
                    ./stage1-pool/libwayland-cursor0_*.deb
                    ./stage1-pool/libwayland-egl1_*.deb
                    ./stage1-pool/libwayland-egl-backend-dev_*.deb
                    ./stage1-pool/libwayland-dev_*.deb
                    ./stage1-pool/libdrm-common_*.deb
                    ./stage1-pool/libdrm2_*.deb
                    ./stage1-pool/libdrm-amdgpu1_*.deb
                    ./stage1-pool/libdrm-freedreno1_*.deb
                    ./stage1-pool/libdrm-intel1_*.deb
                    ./stage1-pool/libdrm-nouveau2_*.deb
                    ./stage1-pool/libdrm-radeon1_*.deb
                    ./stage1-pool/libdrm-dev_*.deb
                    ./stage1-pool/libpixman-1-0_*.deb
                    ./stage1-pool/libpixman-1-dev_*.deb
                    ./stage1-pool/wayland-protocols_*.deb
                    ./stage1-pool/libcairo2_*.deb
                    ./stage1-pool/libcairo-gobject2_*.deb
                    ./stage1-pool/libcairo-script-interpreter2_*.deb
                    ./stage1-pool/libcairo2-dev_*.deb
                    ./stage1-pool/libgstreamer1.0-0_*.deb
                    ./stage1-pool/libgstreamer1.0-dev_*.deb
                    ./stage1-pool/gir1.2-gstreamer-1.0_*.deb
                    ./stage2-pool/libgstreamer-gl1.0-0_*.deb
                    ./stage2-pool/libgstreamer-plugins-base1.0-0_*.deb
                    ./stage2-pool/libgstreamer-plugins-base1.0-dev_*.deb
                    ./stage2-pool/gir1.2-gst-plugins-base-1.0_*.deb
                    ./stage2-pool/gstreamer1.0-plugins-base_*.deb
                    ./stage2-pool/gstreamer1.0-gl_*.deb
                    ./stage3-pool/libgstreamer-plugins-bad1.0-0_*.deb
                    ./stage3-pool/libgstreamer-plugins-bad1.0-dev_*.deb
                    ./stage3-pool/gir1.2-gst-plugins-bad-1.0_*.deb
                    ./stage3-pool/gstreamer1.0-plugins-bad_*.deb
                    ./stage3-pool/gstreamer1.0-plugins-good_*.deb)
              ;;
          esac
          if (( ${#debs[@]} > 0 )); then
            echo "Installing: ${debs[*]}"
            apt-get install -y --no-install-recommends "${debs[@]}"
          else
            echo "No packages of earlier stages required for ${{ matrix.package }}"
          fi

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: ${{ matrix.package }}
          stage: 6


  # ---------------------------------------------------------------------------
  # Stage 7: merge the full pool, generate APT metadata, publish to Pages.
  # ---------------------------------------------------------------------------
  publish:
    name: Stage 7 · generate APT repository
    needs: stage6
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: read
      # deleting old artifacts needs actions: write
      actions: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install APT repository tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev \
            gnupg \
            gzip \
            xz-utils \
            curl \
            ca-certificates \
            python3

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Stage packages into repo-pool
        run: |
          mkdir -p repo-pool
          cp -v downloaded-artifacts/*.deb repo-pool/
          echo "==> Staged packages:"
          ls -l repo-pool/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "$GPG_PRIVATE_KEY" ]]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print "Signing key fingerprint: " $10; exit}'
          else
            echo "Warning: No GPG_PRIVATE_KEY found; repository will be unsigned."
          fi

      - name: Generate APT repository metadata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/generate-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Delete old CI artifacts
        # A free account shares 0.5 GB between the artifacts of all its
        # repositories. The packages are already uploaded to Pages and the
        # rebuilt .deb files live in the Actions cache, so old artifacts of
        # previous runs are useless weight. Housekeeping must never break the
        # publication, hence continue-on-error.
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/cleanup-artifacts.sh 1 24

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


            # Handle deb822 format: Components: main [contrib non-free non-free-firmware]
            # Match with optional leading whitespace and ensure main is present
            sed -i -E 's/^(\s*)Components: main(\s*)$/\1Components: main contrib non-free non-free-firmware/' \

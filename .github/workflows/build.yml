          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3 \

      - name: Download stage 1 packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-stage1-*
          path: stage1-pool
          merge-multiple: true

      - name: Install required packages of earlier stages
        run: |
          shopt -s nullglob
          # apt-get трактует аргументы без разделителя пути как
          # имена пакетов, поэтому скачанные .deb передаются как
          # ./stageN-pool/<файл>.deb
          # ci-closure: wayland собирается против пакетов этого репозитория, а не trixie (добавлено замыканием по Build-Depends)
          debs=(
                ./stage1-pool/libwayland-bin_*.deb
                ./stage1-pool/libwayland-client0_*.deb
                ./stage1-pool/libwayland-cursor0_*.deb
                ./stage1-pool/libwayland-dev_*.deb
                ./stage1-pool/libwayland-egl-backend-dev_*.deb
                ./stage1-pool/libwayland-egl1_*.deb
                ./stage1-pool/libwayland-server0_*.deb
          )
          echo "Installing: ${debs[*]}"
          apt-get install -y --no-install-recommends "${debs[@]}"

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: wayland
          stage: 1

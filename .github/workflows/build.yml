name: Build Packages

on:
  # Фильтр paths одинаков для push и pull_request. Без него на pull_request
  # любой пуш запускал все 32 job'а: правка README или .clinerules не может
  # повлиять ни на один .deb, но стоила получаса работы.
  # workflow_dispatch позволяет пересобрать один пакет вручную, без коммита.
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '!packages/**/README.md'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - '!packages/**/README.md'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      package:
        description: >-
          Собрать только этот пакет (и всех, кто от него зависит). Пусто -
          весь репозиторий, как обычно.
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Inside a container job GitHub Actions defaults to "sh -e {0}", where bashisms
# (shopt, arrays, [[ ... ]]) are unavailable. All scripts and inline steps of this
# pipeline are written for bash, so bash is requested explicitly.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:

  # -------------------------------------------------------------------------
  # Stage 1.
  #
  # Stage считается по фактическим спискам .deb ниже: пакет стоит
  # здесь, если все пакеты, чьи .deb он ставит, собраны раньше.
  # Барьеров стадий нет - job ждёт только тех, от кого зависит.
  # -------------------------------------------------------------------------
  build_libglvnd:
    name: libglvnd (stage 1)
    if: >-
      ${{ !inputs.package || inputs.package == 'celluloid' || inputs.package == 'gstreamer1.0-libav' || inputs.package == 'gstreamer1.0-plugins-bad' || inputs.package == 'gstreamer1.0-plugins-base' || inputs.package == 'gstreamer1.0-plugins-good' || inputs.package == 'gtk+3.0' || inputs.package == 'gtk4' || inputs.package == 'kmscon' || inputs.package == 'labwc' || inputs.package == 'libglvnd' || inputs.package == 'mesa' || inputs.package == 'mpv' || inputs.package == 'neatvnc' || inputs.package == 'pipewire' || inputs.package == 'pwvucontrol' || inputs.package == 'sfwbar' || inputs.package == 'wayvnc' || inputs.package == 'wireplumber' || inputs.package == 'wlroots' }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure APT sources and install build toolchain
        run: |
          # Ensure Debian trixie repositories are configured (deb822 or legacy)
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            # Handle deb822 format: Components: main [contrib non-free non-free-firmware]
            # Match with optional leading whitespace and ensure main is present
            sed -i -E 's/^(\s*)Components: main(\s*)$/\1Components: main contrib non-free non-free-firmware/' \
              /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
            # Also handle case where Components line has multiple values but missing some
            sed -i -E 's/^(\s*)Components: main( contrib)?( non-free)?( non-free-firmware)?(\s*)$/\1Components: main contrib non-free non-free-firmware/' \
              /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          elif [ -f /etc/apt/sources.list ]; then
            sed -i -E 's/^deb (http:\/\/[^ ]+) main$/deb \1 main contrib non-free non-free-firmware/' \
              /etc/apt/sources.list 2>/dev/null || true
          else
            # Fallback: create minimal sources.list for trixie
            echo 'deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware' > /etc/apt/sources.list
          fi
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            ca-certificates \
            rsync \
            git \
            python3 \

      - name: Build package (cached, reuses unchanged results)
        uses: ./.github/actions/build-deb
        with:
          package: libglvnd
          stage: 1
